<div class="speaking-container">
  <div class="speaking-header">
    <div class="header-content">
      <h2>🎙️ Speaking Test</h2>
      <p>{{ questions.length }} câu hỏi - Ghi âm câu trả lời của bạn</p>
    </div>
    <div class="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="getProgressPercent()"></div>
      </div>
      <span>{{ getProgressPercent() }}% hoàn thành</span>
    </div>
  </div>

  <!-- 3 Questions -->
  <div class="questions-container">
    <div *ngFor="let q of questions; let i = index" class="question-card">
      <div class="question-header">
        <span class="q-number">Câu {{ i + 1 }}</span>
        <span class="q-status" [class.completed]="audioBlobs[i]">
          {{ audioBlobs[i] ? '✅ Đã ghi âm' : '⏳ Chưa ghi âm' }}
        </span>
      </div>

      <div class="question-text">{{ q.questionText }}</div>

      <div class="time-info">
        <span>⏱️ Chuẩn bị: {{ q.preparationTime || 30 }}s</span>
        <span>🎤 Nói: {{ q.speakingTime || 60 }}s</span>
      </div>

      <!-- Transcript -->
      <div class="transcript-section">
        <label>📝 Nội dung bài nói (Transcript):</label>
        <textarea 
          [(ngModel)]="transcripts[i]"
          (input)="updateTranscript(i, $event)"
          placeholder="Nhập nội dung bạn đã nói..."
          rows="3"
          [disabled]="isSubmitting">
        </textarea>
      </div>

      <!-- Recording Controls -->
      <div class="recording-controls">
        <!-- Chưa ghi âm và không đang ghi âm câu nào -->
        <button 
          *ngIf="!audioBlobs[i] && !(isRecording && currentRecordingIndex === i)"
          class="btn-record" 
          (click)="startRecording(i)"
          [disabled]="isPreparing || isRecording">
          🎙️ Bắt đầu ghi âm
        </button>

        <!-- Đang ghi âm câu này -->
        <button 
          *ngIf="isRecording && currentRecordingIndex === i"
          class="btn-stop" 
          (click)="stopRecording()">
          ⏹️ Dừng ghi âm
        </button>

        <!-- Đã ghi âm -->
        <div *ngIf="audioBlobs[i]" class="audio-controls">
          <span class="status-icon">✅ Đã ghi âm</span>
          <button class="btn-play" (click)="playRecording(i)" [disabled]="isPlaying[i]">
            {{ isPlaying[i] ? '⏳ Đang phát...' : '▶️ Nghe lại' }}
          </button>
          <button class="btn-rerecord" (click)="startRecording(i)">
            🔄 Ghi âm lại
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-back" (click)="goBack()">← Quay lại</button>
    <button 
      class="btn-submit" 
      (click)="submitSpeaking()" 
      [disabled]="isSubmitting">
      {{ isProcessing ? '⏳ Đang xử lý...' : '📤 Nộp bài' }}
    </button>
  </div>
</div>
